name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '30' # Or your target SDK
          ndk-version: '25.2.8563518' # Or latest

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebug

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30 # Match your target or compile SDK if possible. Use 30 as a safe fallback
          target: google_apis
          arch: x86_64
          profile: pixel_3a # Use a common and relatively lightweight profile
          script: ./gradlew connectedCheck # Run connected checks after emulator starts
          cores: 4 # Allocate more cores (if available)
          avd-name: test # Fixed AVD name
          force-avd-creation: true # Force recreation to avoid potential issues
          emulator-boot-timeout: 600 # Increased timeout (10 minutes) - crucial!
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: true # Important for CI stability
          enable-hw-keyboard: false
          channel: stable
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 512

      - name: Upload APK (Optional)
        uses: actions/upload-artifact@v3
        if: always() # Ensure upload even if tests fail
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Test Results (Optional)
        uses: actions/upload-artifact@v3
        if: always() # Ensure upload even if tests fail
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/