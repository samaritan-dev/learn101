name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Set a timeout to prevent indefinite runs

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache JDK
        uses: actions/cache@v3
        with:
          path: ~/.java
          key: ${{ runner.os }}-jdk-${{ steps.setup-java.outputs.java-version }}-temurin
          restore-keys: |
            ${{ runner.os }}-jdk-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '34'
          ndk-version: '25.2.8563518'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK components
        id: cache-android-sdk
        uses: actions/cache@v3
        with:
          path: ~/.android/cache
          key: ${{ runner.os }}-android-sdk-cache-${{ hashFiles('**/build.gradle', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-cache-

      - name: Cache Android SDK Platform Tools
        id: cache-android-platform-tools
        uses: actions/cache@v3
        with:
          path: ~/Android/Sdk/platform-tools
          key: ${{ runner.os }}-android-platform-tools
          restore-keys: |
            ${{ runner.os }}-android-platform-tools

      - name: Cache Android SDK Build Tools
        id: cache-android-build-tools
        uses: actions/cache@v3
        with:
          path: ~/Android/Sdk/build-tools
          key: ${{ runner.os }}-android-build-tools
          restore-keys: |
            ${{ runner.os }}-android-build-tools

      - name: Cache Android SDK Platforms
        id: cache-android-platforms
        uses: actions/cache@v3
        with:
          path: ~/Android/Sdk/platforms
          key: ${{ runner.os }}-android-platforms
          restore-keys: |
            ${{ runner.os }}-android-platforms

      - name: Install system dependencies for emulator
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends \
            libgl1-mesa-dri \
            libgl1-mesa-glx \
            libx11-6

      - name: Install emulator and dependencies
        run: |
          sdkmanager --install "system-images;android-30;google_apis;x86_64" "emulator" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Create AVD
        run: |
          avdmanager create avd -n test_emulator -k "system-images;android-30;google_apis;x86_64" --force

      - name: Launch emulator
        run: |
          nohup emulator -avd test_emulator -no-window -no-audio -no-boot-anim &
          adb wait-for-device
          adb shell input keyevent 82 # Unlock screen

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Run UI tests
        run: ./gradlew connectedCheck # Use connectedCheck for UI tests

      - name: Upload APK (Optional)
        uses: actions/upload-artifact@v3
        if: always() # Run even if tests fail
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/