name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
      options: --privileged # Important: Required for KVM

    steps:
      - name: Check KVM availability
        run: |
          kvm-ok || { sudo apt-get update && sudo apt-get install -y qemu-kvm libvirt-daemon-system; kvm-ok; }

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            openjdk-17-jdk \
            libncurses5 \
            lib32stdc++6 \
            lib32z1 \
            libc6-i386 \
            qemu-kvm \
            libvirt-daemon-system

      - name: Add user to kvm group
        run: sudo adduser $USER kvm

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '34'
          ndk-version: '25.2.8563518'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          avd-name: pixel_7_avd
          skin: pixel_7
          script: echo "Start Emulator"
          timeout-minutes: 10 # Increase timeout if needed
          emulator-options: -no-snapshot-save # Prevents issues with snapshots

      - name: Run UI Tests
        run: ./gradlew connectedCheck

      - name: Upload APK (Optional)
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Test Results (Optional)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/