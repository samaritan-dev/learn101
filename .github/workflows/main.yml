name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and Push Docker Image
        runs-on: ubuntu-latest
        steps:
          - name: Build Docker Image
            run: |
              docker build -t my-android-project:latest . 

          - name: Push Docker Image to Container Registry (if needed)
            run: |
              docker push my-android-project:latest 

      - name: Run Tests with Emulator
        runs-on: ubuntu-latest
        steps:
          - name: Pull Docker Image
            run: docker pull my-android-project:latest

          - name: Run Container with Emulator
            run: |
              docker run -it -e ANDROID_EMULATOR_LAUNCH_ARGS="-no-snapshot -gpu host" \
                  -p 5554:5554 \ 
                  -p 5555:5555 \ 
                  -p 5556:5556 \ 
                  # ... (forward other necessary ports as mentioned earlier) \
                  my-android-project:latest 

          - name: Run Tests (replace with your actual test command)
            run: ./gradlew connectedAndroidTest