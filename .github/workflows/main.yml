name: Android CI - UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_ARCH: x86_64
  EMULATOR_NAME: test_avd
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android-ui-tests:
    name: Run Android UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk-version: 25.2.9519653
          cmake-version: 3.22.1
          licenses: |
            android-sdk-license
            android-sdk-preview-license
            android-gradle-plugin-license

      - name: Install System Image
        run: |
          echo "Installing required system images..."
          sdkmanager --install "system-images;android-${{ env.ANDROID_API_LEVEL }};default;${{ env.ANDROID_ARCH }}"
          sdkmanager --install "platform-tools"

      - name: Create Android Virtual Device (AVD)
        run: |
          echo "Creating AVD..."
          echo "no" | avdmanager create avd --name ${{ env.EMULATOR_NAME }} \
          --package "system-images;android-${{ env.ANDROID_API_LEVEL }};default;${{ env.ANDROID_ARCH }}" \
          --force

      - name: Start emulator
        run: |
          echo "Starting AVD..."
          nohup $ANDROID_HOME/emulator/emulator -avd ${{ env.EMULATOR_NAME }} \
            -no-audio -no-snapshot -no-window -gpu swiftshader_indirect \
            -camera-back none -camera-front none > /dev/null 2>&1 &

          echo "Waiting for emulator to start..."
          adb wait-for-device

          # Check if the device is fully booted
          boot_completed=false
          while [ "$boot_completed" != "1" ]; do
            sleep 5
            boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null)
            echo "Boot status: $boot_completed"
          done

          echo "Emulator booted! Unlocking screen and disabling animations..."
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0.0
          adb shell settings put global transition_animation_scale 0.0
          adb shell settings put global animator_duration_scale 0.0

      - name: Run UI tests
        run: |
          ./gradlew connectedDebugAndroidTest \
            --stacktrace \
            --no-daemon \
            --max-workers=2 \
            --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/**

      - name: Stop emulator
        if: always()
        run: |
          adb emu kill || true