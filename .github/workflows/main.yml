name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for pushing to GitHub Container Registry
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/android-ci:latest

  android-tests:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/android-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v3

      - name: Increase Disk Space
        run: df -h

      - name: Create AVD
        run: |
          echo "Creating AVD..."
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p ~/.android/avd
          echo "no" | avdmanager create avd --name test_avd --package "system-images;android-33;google_apis;x86_64" --abi x86_64 --device "pixel" --force
          avdmanager list avd

      - name: Debug AVD
        run: |
          ls -la ~/.android/avd
          cat ~/.android/avd/test_avd.ini || echo "AVD config missing"

      - name: Start Emulator
        timeout-minutes: 10
        run: |
          echo "Starting emulator..."
          export DISPLAY=:1
          nohup emulator -avd test_avd -no-window -no-audio -no-boot-anim -accel on -no-snapshot-load -gpu swiftshader_indirect &
          sleep 60  # Allow emulator to start
          adb wait-for-device
          adb shell input keyevent 82
          echo "Waiting for emulator to boot..."
          while [[ $(adb shell getprop sys.boot_completed) != 1 ]]; do
            sleep 5
            echo "Waiting..."
          done
          echo "Emulator booted!"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run UI Tests
        run: ./gradlew connectedCheck
