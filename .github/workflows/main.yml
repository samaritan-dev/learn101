name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends \
            libgl1-mesa-dri \
            libxext6 \
            libxrender1 \
            libxi6 \
            unzip \
            wget \
            xvfb

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH

          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip

          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-33" "system-images;android-33;google_apis;x86_64" "emulator" "platform-tools"

      - name: Create AVD
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME
          echo "no" | avdmanager create avd -n test_emulator -k "system-images;android-33;google_apis;x86_64" --device "pixel_3a" --force
          ls -l $ANDROID_AVD_HOME # Debugging: Confirm AVD was created

      - name: Set up display for emulator
        run: |
          sudo Xvfb :1 -screen 0 1024x768x24 &
          export DISPLAY=:1

      - name: Launch emulator
        run: |
          export EMULATOR_PATH=$ANDROID_HOME/emulator/emulator
          nohup $EMULATOR_PATH -avd test_emulator -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -verbose &
          adb wait-for-device
          sleep 5
          adb shell input keyevent 82

      - name: Wait for emulator to boot completely
        run: |
          adb wait-for-device
          boot_completed=""
          until [[ "$boot_completed" == "1" ]]; do
            sleep 5
            boot_completed=$(adb shell getprop sys.boot_completed | tr -d '\r')
            echo "Waiting for emulator to boot..."
          done
          echo "Emulator is ready!"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --build-cache --parallel --daemon

      - name: Run UI tests
        run: ./gradlew connectedCheck

      - name: Upload APK (Optional)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/

      - name: Cleanup AVD
        if: always()
        run: rm -rf ~/.android/avd/test_emulator.avd ~/.android/avd/test_emulator.ini