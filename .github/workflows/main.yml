name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest # Strongly recommended for best performance
    # runs-on: macos-latest # Only use if absolutely necessary, with arm64-v8a and SwiftShader
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Run tests on emulators
        id: emulator # Give an ID to the step
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis # Or google_apis_playstore if you need Play Services
          arch: x86_64 # Use arm64-v8a if using macos-latest
          script: ./gradlew connectedCheck
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window # -gpu swiftshader add for macos
          disable-animations: true
          avd-name: test_emulator
          working-directory: ./app # Adjust if your tests are in a subfolder
          emulator-timeout: 600 # Increase if emulator startup takes longer
          test-timeout: 900 # Increase if your tests take longer

      - name: Reduce Emulator Cores
        if: steps.emulator.outcome == 'success' # Only if emulator started
        run: |
          echo "hw.cpu.ncore=1" >> ~/.android/avd/test_emulator.avd/config.ini
          cat ~/.android/avd/test_emulator.avd/config.ini # Verify the change

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/

      - name: Upload APK
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk