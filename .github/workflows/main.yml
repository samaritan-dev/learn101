name: Android CI - UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JDK_VERSION: 17
  DISTRIBUTION: 'zulu'

jobs:
  android-test:
    name: Instrumentation Tests (${{ matrix.device.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: pixel8Api34, img: 'system-images;android-34;aosp_atd;x86_64' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JDK_VERSION }}

      - name: Install platform-tools and emulator
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "emulator"

      - name: Add Android SDK tools to path
        run: echo "$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install System Image for Emulator
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --install "${{ matrix.device.img }}"

      - name: Accept licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create AVD and Start Emulator
        run: |
          echo "yes" | "$ANDROID_HOME"/cmdline-tools/latest/bin/avdmanager create avd -n testDevice -k "${{ matrix.device.img }}"
          nohup "$ANDROID_HOME"/emulator/emulator -avd testDevice -no-window -noaudio -no-boot-anim -camera-back none -camera-front none -wipe-data -accel auto -gpu swiftshader_indirect > emulator.log 2>&1 &

      - name: Wait for emulator to boot
        run: $ANDROID_HOME/platform-tools/adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done; input keyevent 82'

      - name: List Gradle tasks for instrumentation tests
        run: ./gradlew tasks

      - name: Run instrumentation tests
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: connectedDebugAndroidTest

      - name: Upload instrumentation test reports and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports-${{ matrix.device.name }}
          path: |
            */build/reports/androidTests/**/${{ matrix.device.name }}
            */build/outputs/androidTest-results/**/${{ matrix.device.name }}