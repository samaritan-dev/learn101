name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for pushing to GitHub Container Registry
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Cached Image (If Exists)
        continue-on-error: true
        run: docker pull ghcr.io/${{ github.repository_owner }}/android-ci:latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/android-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/android-ci:latest
          cache-to: type=inline

  android-tests:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/android-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v3

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Install Required Android System Image
        run: |
          export ANDROID_HOME=/root/.android
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | sdkmanager --install "system-images;android-33;google_apis;x86_64"

      - name: Create AVD
        run: |
          export ANDROID_HOME=/root/.android
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/avd

          echo "Deleting existing AVD (if any)..."
          avdmanager delete avd -n test_avd || true

          echo "Creating new AVD..."
          echo "no" | avdmanager create avd -n test_avd --package "system-images;android-33;google_apis;x86_64" --abi x86_64 --device "pixel" --force

          echo "Verifying AVD creation..."
          ls -la $ANDROID_HOME/avd

          if [ ! -f "$ANDROID_HOME/avd/test_avd.ini" ]; then
            echo "AVD configuration file is missing!"
            exit 1
          fi

      - name: Start Emulator
        timeout-minutes: 10
        run: |
          export DISPLAY=:1
          nohup emulator -avd test_avd -no-window -no-audio -no-boot-anim -accel on -no-snapshot-load -gpu swiftshader_indirect &
          sleep 60  # Allow emulator to start

          echo "Waiting for emulator to be ready..."
          adb wait-for-device
          adb shell input keyevent 82

          while [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]]; do
            echo "Waiting for emulator to boot..."
            sleep 5
          done
          echo "Emulator is ready!"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run UI Tests
        run: ./gradlew connectedCheck