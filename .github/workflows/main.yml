name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '34'
          ndk-version: '25.2.8563518'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Create AVD and Launch Emulator
        run: |
          echo "Creating and starting AVD..."
          echo "no" | avdmanager create avd -n test_avd -k "system-images;android-34;google_apis;x86_64" --force
          $ANDROID_HOME/emulator/emulator -avd test_avd -no-window -no-audio -no-boot-anim -no-snapshot-load &
          echo "Waiting for emulator to be ready..."
          sleep 60
          adb wait-for-device
          adb shell getprop sys.boot_completed | grep -m 1 '1'
          adb devices
          echo "Emulator is ready!"

      - name: Restart ADB (Fix Offline Device)
        run: |
          adb kill-server
          adb start-server
          adb devices

      - name: Run UI Tests
        run: ./gradlew connectedCheck

      - name: Upload APK (Optional)
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Test Results (Optional)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/
