name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up Android SDK (with continue-on-error)
        uses: android-actions/setup-android@v3
        id: setup-android
        with:
          java-version: 17
          cmdline-tools-version: "latest"
          sdk-components: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2
            system-images;android-33;google_apis;x86_64
        continue-on-error: true
      - name: Attempt to install the system image directly (DEBUGGING)
        run: sdkmanager "system-images;android-33;google_apis;x86_64" || true
      - name: Check SDK Installation
        run: |
          if [ ! -d "$ANDROID_HOME/system-images/android-33/google_apis/x86_64" ]; then
            echo "ERROR: System image NOT found. Inspect previous step logs."
            ls -l $ANDROID_HOME/system-images || true
            sdkmanager --list --verbose
            exit 1
          fi
          echo "System image found."
      - name: Accept licenses
        run: yes | sdkmanager --licenses
      - name: Create AVD
        run: |
          avd_output=$(echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            --force \
            -n test \
            -k "system-images;android-33;google_apis;x86_64" \
            --abi x86_64 \
            --device "pixel_6" 2>&1)
          avd_path=$(echo "$avd_output" | grep "Path:" | awk '{print $2}')

          # Wait for AVD creation to fully complete (check for hardware-qemu.ini)
          timeout 60 sh -c 'while [[ ! -f "$avd_path/hardware-qemu.ini" ]]; do sleep 5; echo "Waiting for AVD to finish setup..."; done' || {
            echo "ERROR: AVD setup timed out!"
            echo "avdmanager output:"
            echo "$avd_output"
            $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd
            ls -l "$HOME/.android/avd" || true
            ls -l "/home/runner/.config/.android/avd" || true
            ls -l "$avd_path" || true
            exit 1
          }

          echo "AVD created successfully at $avd_path!"
      - name: Start Emulator
        run: |
          $ANDROID_HOME/emulator/emulator -avd test -no-window -gpu swiftshader_indirect -no-audio &
          adb wait-for-device
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      - name: Run unit tests
        run: ./gradlew test
      - name: Run UI tests
        run: ./gradlew connectedCheck
      - name: Upload APK (Optional)
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk