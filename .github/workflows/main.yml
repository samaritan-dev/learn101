name: Android CI (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest # Force macOS runner
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Run tests on emulators
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2.33.0 # Use v3 to fix warnings
        with:
          api-level: 30
          target: google_apis # Or google_apis_playstore
          arch: arm64-v8a # MUST be arm64-v8a on macOS
          script: ./gradlew connectedCheck
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader # Force SwiftShader - CRUCIAL for macOS
          disable-animations: true
          avd-name: test_emulator
          working-directory: ./app # Adjust if your tests are in a subfolder
          emulator-timeout: 600 # Adjust if necessary
          test-timeout: 900 # Adjust if necessary
          system-images: android-30;google_apis;arm64-v8a # Explicitly define system images

      # No need for the "Reduce Emulator Cores" step unless you specifically need to override the default

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/

      - name: Upload APK
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk