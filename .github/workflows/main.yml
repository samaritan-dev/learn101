name: Android CI - UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JDK_VERSION: 17
  DISTRIBUTION: 'zulu'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: List Gradle tasks  # Keep this step for now for debugging if needed
        run: ./gradlew tasks

      - name: Build debug APK # Changed task name to assembleDebug
        run: ./gradlew assembleDebug --parallel --build-cache

      - name: Upload build outputs (APKs)
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: app/build/outputs

      - name: Upload build reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: "*/build/reports"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Run local tests
        run: ./gradlew test --parallel --build-cache

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "*/build/reports/tests"

  android-test:
    name: Instrumentation Tests (${{ matrix.device.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: pixel8Api34, img: 'system-images;android-34;aosp_atd;x86_64' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JDK_VERSION }}

      - name: Install Emulator
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --install "${{ matrix.device.img }}"

      - name: Accept licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create AVD and Start Emulator # ADDED step to create and start emulator
        run: |
          echo "no" | "$ANDROID_HOME"/cmdline-tools/latest/bin/avdmanager create avd -n testDevice -k "${{ matrix.device.img }}"
          # Start emulator in the background, with no window (-no-window), and logcat output to a file
          nohup "$ANDROID_HOME"/emulator/emulator -avd testDevice -no-window -noaudio -no-boot-anim -camera-back none -camera-front none -wipe-data -accel auto -gpu swiftshader_indirect > emulator.log 2>&1 &
          # Wait for emulator to boot (check for adb devices to list a device)
          ./adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done; input keyevent 82'

      - name: Wait for emulator to boot # Explicitly wait for boot completion
        run: adb wait-for-device shell getprop sys.boot_completed

      - name: List Gradle tasks for instrumentation tests # Keep for debugging
        run: ./gradlew tasks

      - name: Run instrumentation tests # Use connectedDebugAndroidTest
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: connectedDebugAndroidTest

      - name: Upload instrumentation test reports and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports-${{ matrix.device.name }}
          path: |
            */build/reports/androidTests/**/${{ matrix.device.name }}
            */build/outputs/androidTest-results/**/${{ matrix.device.name }}
  spotless:
    name: Spotless Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Spotless Check
        run: ./gradlew spotlessCheck --init-script gradle/init.gradle.kts --parallel --build-cache