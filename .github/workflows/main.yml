name: Android Instrumentation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  android-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: List Available Emulators
        run: |
          echo "Available Android Virtual Devices:"
          $ANDROID_HOME/emulator/emulator -list-avds

      - name: Start Existing Emulator
        run: |
          EMULATOR_NAME=$($ANDROID_HOME/emulator/emulator -list-avds | head -n 1)
          if [ -z "$EMULATOR_NAME" ]; then
            echo "No emulator found. Exiting."
            exit 1
          fi
          echo "Starting emulator: $EMULATOR_NAME"
          nohup $ANDROID_HOME/emulator/emulator -avd $EMULATOR_NAME -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &

      - name: Wait for Emulator to Boot
        run: |
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82

      - name: Run Instrumented Tests
        run: ./gradlew connectedCheck

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/
