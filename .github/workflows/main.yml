name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '34'
          ndk-version: '25.2.8563518'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Start Android Emulator
        uses: android-actions/start-android-emulator@v3
        with:
          api-level: 30 # Choose an appropriate API level
          target: google_apis # Or default
          arch: x86_64 # Or arm64-v8a if needed, but x86_64 is faster for CI
          profile: pixel_6 # Optional: Specify a device profile
          avd-name: test # Optional: Name for the AVD
          script: echo "Start Emulator"

      - name: Run UI Tests
        uses: gradle-actions/android-emulator-runner@v2
        with:
          gradle-task: connectedCheck # Runs connected tests (UI tests)
          emulator-options: -no-snapshot-save # Prevents saving emulator state, faster
          emulator-build-command: ./gradlew assembleDebug

      - name: Upload APK (Optional)
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Test Results (Optional)
        uses: actions/upload-artifact@v3
        if: always() # upload even if tests fail
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/