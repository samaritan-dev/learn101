name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t my-android-project:latest . 

      - name: Push Docker Image to Container Registry (optional)
        run: |
          docker push my-android-project:latest 

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Pull Docker Image
        run: docker pull my-android-project:latest

      - name: Run Container with Emulator
        run: |
          docker run --privileged -d --name android_emulator \
              -e ANDROID_EMULATOR_LAUNCH_ARGS="-no-snapshot -gpu host" \
              -p 5554:5554 -p 5555:5555 -p 5556:5556 \
              my-android-project:latest

      - name: Run Tests
        run: docker exec android_emulator ./gradlew connectedAndroidTest
