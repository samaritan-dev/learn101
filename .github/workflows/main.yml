name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17

      - name: Upload HTML test report
        uses: actions/upload-artifact@v2
        with:
          name: lint.html
          path: app/build/reports/lint-results-debug.html

  unit-test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report
        uses: actions/upload-artifact@v2
        with:
          name: unit_test_report
          path: app/build/reports/tests/testDebugUnitTest/

  instrumentation-test:
    needs: [unit-test]
    runs-on: macos-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17

      - name: Download & Set Up Android Command Line Tools
        run: |
          ANDROID_HOME=$HOME/android-sdk
          ANDROID_SDK_ROOT=$ANDROID_HOME
          CMDLINE_TOOLS=$ANDROID_HOME/cmdline-tools/latest
          mkdir -p $CMDLINE_TOOLS
          curl -o sdk-tools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip sdk-tools.zip -d $CMDLINE_TOOLS
          mv $CMDLINE_TOOLS/cmdline-tools/* $CMDLINE_TOOLS/
          rm -rf $CMDLINE_TOOLS/cmdline-tools
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Install SDK Platform 34 (ARM64)
        run: |
          sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "platforms;android-34" "system-images;android-34;google_apis_playstore;arm64-v8a"

      - name: Force AVD Creation and Start Emulator
        run: |
          echo "no" | android create avd --force --name Pixel_6_ARM --target android-34 --abi google_apis/arm64-v8a
          emulator -avd Pixel_6_ARM -no-window -noaudio -gpu swiftshader_indirect &
          adb wait-for-device
          adb shell getprop sys.boot_completed || echo "Emulator not started"
          adb logcat -d > emulator-log.txt
          cat emulator-log.txt

      - name: Run Espresso Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: arm64-v8a
          profile: pixel_6
          avd-name: Pixel_6_ARM
          force-avd-creation: true
          emulator-options: "-gpu swiftshader_indirect -noaudio -no-boot-anim -no-window"
          script: ./gradlew connectedCheck
          emulator-wait-timeout: 600

      - name: Upload Instrumentation Test Report
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation_test_report
          path: app/build/reports/androidTests/connected/

  static-code-analysis:
    needs: [instrumentation-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17

      - name: SonarCloud Scan
        run: ./gradlew app:sonarqube -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    needs: [static-code-analysis]
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: expense-manager.apk
          path: app/build/outputs/apk/debug/app-debug.apk