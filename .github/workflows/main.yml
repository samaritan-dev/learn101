name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache JDK
        uses: actions/cache@v3
        with:
          path: ~/.java
          key: ${{ runner.os }}-jdk-${{ steps.setup-java.outputs.java-version }}-temurin
          restore-keys: |
            ${{ runner.os }}-jdk-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '33'
          ndk-version: '25.2.8563518' # Optional: If you use NDK

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK components
        uses: actions/cache@v3
        with:
          path: ~/.android/cache
          key: ${{ runner.os }}-android-sdk-cache-${{ hashFiles('**/build.gradle', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-cache-

      - name: Cache Android SDK Platform Tools
        uses: actions/cache@v3
        with:
          path: ~/Android/Sdk/platform-tools
          key: ${{ runner.os }}-android-platform-tools
          restore-keys: |
            ${{ runner.os }}-android-platform-tools

      - name: Cache Android SDK Build Tools
        uses: actions/cache@v3
        with:
          path: ~/Android/Sdk/build-tools
          key: ${{ runner.os }}-android-build-tools
          restore-keys: |
            ${{ runner.os }}-android-build-tools

      - name: Cache Android SDK Platforms
        uses: actions/cache@v3
        with:
          path: ~/Android/Sdk/platforms
          key: ${{ runner.os }}-android-platforms
          restore-keys: |
            ${{ runner.os }}-android-platforms

      - name: Install system dependencies for emulator
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-recommends \
            libgl1-mesa-dri \
            libxext6 \
            libxrender1 \
            libxi6

      - name: Set up display for emulator
        run: |
          sudo Xvfb :1 -screen 0 1024x768x24 &
          export DISPLAY=:1

      - name: Create .android directory and repositories.cfg
        run: |
          mkdir -p ~/.android/avd
          touch ~/.android/repositories.cfg

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install emulator and system image
        run: |
          sdkmanager --install "system-images;android-33;google_apis;x86_64" "emulator" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd -n test_emulator -k "system-images;android-33;google_apis;x86_64" --force
          ls -l ~/.android/avd # Debug: List AVDs to confirm creation

      - name: Launch emulator
        run: |
          EMULATOR_PATH="$ANDROID_HOME/emulator/emulator"
          nohup "$EMULATOR_PATH" -avd test_emulator -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          adb wait-for-device
          adb shell input keyevent 82
          sleep 5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Run UI tests
        run: ./gradlew connectedCheck

      - name: Upload APK (Optional)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/build/reports/androidTests/connected/